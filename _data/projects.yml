- category: "Progetti Personali"
  items:
    - title: "LiteraryLog"
      link: "https://github.com/panuozzo77/LiteraryLog"
      description: "Piccolo progettino che utilizzo per tenere traccia delle mie letture, in maniera indipendente e sempre accessibile. Genera un semplicissimo readme tabellare personalizzabile con la lista dei libri terminati."
      tech: "Go, Git"
    - title: "Inactivity Tracker Bot"
      link: "https://github.com/panuozzo77/longest-inactivity-tracker-tgbot"
      description: "Un bot Telegram da aggiungere ai gruppi, che registra il periodo di silenzio più lungo mai verificatosi nella chat. Include anche una classifica con l’ultimo utente che ha inviato un messaggio e con chi, di solito, interrompe il silenzio. Divertente."
      tech: "Python"
    - title: "Tic-Tac-Toe RL"
      link: "https://github.com/panuozzo77/ttt-rl-C_and_react"
      description: "È un progetto che combina Reinforcement Learning (RL) con un’interfaccia web, per realizzare un giocatore (agente) che impara a giocare a Tic-Tac-Toe. È basato su un progetto precedente di Salvatore Sanfilippo, sull'idea di MENACE di Donald Michie."
      tech: "C"
    - title: "Ollama in Google Colab"
      link: "https://github.com/panuozzo77/colab-ollama-webui"
      description: "Notebook con cui ho trovato un escamotage per rendere raggiungibile l'API di Ollama eseguita su Colab all'esterno 🤫."
      tech: "Python, Jupyter Notebook"

